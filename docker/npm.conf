# Nginx Proxy Manager → Hosts → Proxy Host → Advanced.
# Proxy Host: scheme http, forward hostname = web, port 3000,
# Websockets Support on, Block Common Exploits on, TLS via Let's Encrypt.
#
# Response security headers are set by the app (next.config.ts `headers()`).
# Do not add them here: an add_header inside the proxy's location block cancels
# the server-level set, and two CSP headers make browsers enforce the
# intersection, which breaks images and fonts.

# /api/revalidate carries a secret; cap attempts so it cannot be guessed at wire speed.
# The zone must be declared in the `http` context, not here
# (NPM: /data/nginx/custom/http.conf):
#   limit_req_zone $binary_remote_addr zone=revalidate:10m rate=10r/m;
# Change `web` below to your Proxy Host's Forward Hostname if it differs
# (see DEPLOY.md: `web`, or the compose service name `portofolio_new-web-1`).
location = /api/revalidate {
  limit_req zone=revalidate burst=5 nodelay;
  limit_req_status 429;
  proxy_pass http://web:3000;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
}
