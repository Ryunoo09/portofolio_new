# Nginx Proxy Manager → Hosts → Proxy Host → Advanced.
# Proxy Host: scheme http, forward hostname = portfolio-web, port 3000,
# Websockets Support on, Block Common Exploits on, TLS via Let's Encrypt.
#
# script-src needs 'unsafe-inline': the prerendered HTML ships inline
# bootstrap scripts, and a nonce would force dynamic rendering.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.supabase.co; media-src 'self' https://*.supabase.co; font-src 'self'; connect-src 'self' https://*.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" always;
