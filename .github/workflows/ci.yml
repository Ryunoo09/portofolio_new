name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      - name: JS budget (250 KB gzip on /)
        run: |
          pnpm start --port 3100 > /tmp/next-start.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3100/api/health > /dev/null; then break; fi
            sleep 1
          done
          node scripts/bundle-size.mjs http://localhost:3100
          pkill -f "next-server" || true

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Separate job: @lhci/cli pulls esbuild, whose postinstall pnpm blocks in the
  # main job. Keeping it isolated keeps the quality job dependency-free of it.
  lighthouse:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Chromium from Playwright is not on PATH, so hand its path to Lighthouse.
      - name: Lighthouse CI (KPI-1 + 250 KB script budget)
        run: |
          export CHROME_PATH="$(node -e "console.log(require('@playwright/test').chromium.executablePath())")"
          echo "CHROME_PATH=$CHROME_PATH"
          pnpm dlx @lhci/cli@0.16 autorun

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-results
          path: lighthouse-results/
          retention-days: 7

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high

  docker:
    needs: quality
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      # Run the image, not the repository, so no package manager settings leak in.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: portfolio-web:ci
          # Baked at build time: image host allow-list and absolute metadata URLs.
          # NEXT_PUBLIC values are public (they appear in the HTML), so either a
          # Variable or a Secret is accepted: an empty build arg strips the host
          # from next/image's allow-list and breaks every cover.
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        run: |
          docker run -d --name web -p 127.0.0.1:3100:3000 portfolio-web:ci
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3100/api/health > /dev/null; then break; fi
            sleep 2
          done
          docker logs web
          curl -fsS http://127.0.0.1:3100/api/health

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        run: |
          docker tag portfolio-web:ci "${IMAGE}:latest"
          docker tag portfolio-web:ci "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:latest"
          docker push "${IMAGE}:${GITHUB_SHA}"

  # After the image is in GHCR, pull it on the VPS and restart the container.
  # The tag is the commit SHA, so a bad deploy rolls back with
  # `TAG=<previous-sha> ./scripts/deploy.sh`.
  deploy:
    needs: [docker, lighthouse]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Add required reviewers under Settings > Environments to gate production.
    environment: production
    steps:
      - name: Install the deploy key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.VPS_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Pull and restart on the VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PATH: ${{ vars.VPS_PATH || '/opt/portofolio' }}
          TAG: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes "${VPS_USER}@${VPS_HOST}" \
            "cd '${VPS_PATH}' && TAG='${TAG}' ./scripts/deploy.sh"
